[project]
name = "linear-cli"
version = "0.1.0"
description = "Minimal Linear CLI adapter for agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "chewcorp" }]

[project.scripts]
linear-cli = "linear_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25.0.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
